<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  SZABLON BRAMKI MANUALNEJ — wersja 3 (kanon od 2026-09-03)
  Pełne uzasadnienie każdej reguły: manual-gate-form.md (obok tego pliku).

  JAK GO UŻYĆ
    1. Skopiuj na Pulpit jako ~/Desktop/bramka-<slug>-<YYYY-MM-DD>.html
    2. Zmień obiekt GATE na dole (klucz, nazwa pliku wyniku, tytuł, lead, meta, bloki wstępu).
    3. Wypełnij tablicę GROUPS scenariuszami.
    4. NIC WIĘCEJ NIE RUSZAJ. Cała reszta pliku to silnik — HTML kart generuje się z danych.

  DLACZEGO DANE, A NIE RĘCZNY HTML (zmiana względem v2)
    W v2 każda karta była pisana ręcznie i wymagała zgodności trójki data-id / id="c-…" / name="v-…".
    Rozjazd w tej trójce cicho gubił werdykt. W v3 identyfikator jest jeden — pole `id` w danych.

  MECHANIKA, KTÓREJ NIE RUSZASZ
    - zapis stanu przy każdym kliknięciu i każdej literze (bez debounce, bez przycisku „zapisz stan"),
    - ciche przywrócenie przy otwarciu (żadnego bannera „znaleziono wersję roboczą, przywrócić?"),
    - werdykt i uwaga to DWIE OSOBNE RZECZY: „Mam uwagę" nie zmienia werdyktu,
    - wynik wychodzi jako MARKDOWN — to jest kanał odczytu dla Managera,
    - „Kopiuj" przy każdym promptcie, z fallbackiem na execCommand (file:// blokuje clipboard API),
    - „bez werdyktu" nigdy nie liczy się jako pass.
-->
<title>Bramka manualna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --brand: #1355d3;
    --brand-light: #6796f0;
    --brand-wash: #eaf1fc;
    --ink: #071728;
    --ink-soft: #33455a;
    --ink-muted: #67788c;
    --ground: #f5f8fd;
    --panel: #ffffff;
    --panel-sunken: #f0f4fb;
    --line: #d9e3f2;
    --line-soft: #e8eef8;
    --ok: #16a34a;
    --ok-wash: #e8f7ee;
    --no: #de4156;
    --no-wash: #fdecee;
    --mine: #b57500;
    --mine-wash: #fdf3e0;
    --shadow: 0 1px 2px rgba(7, 23, 40, .05), 0 8px 24px -16px rgba(7, 23, 40, .18);
    --font-ui: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --brand: #6796f0;
      --brand-light: #93b6f5;
      --brand-wash: rgba(103, 150, 240, .12);
      --ink: #f2f6fc;
      --ink-soft: #c4d0e0;
      --ink-muted: #8b9cb1;
      --ground: #03101e;
      --panel: #0a1a2b;
      --panel-sunken: #071728;
      --line: rgba(255, 255, 255, .13);
      --line-soft: rgba(255, 255, 255, .08);
      --ok: #4ade80;
      --ok-wash: rgba(74, 222, 128, .13);
      --no: #f87f8d;
      --no-wash: rgba(248, 127, 141, .13);
      --mine: #ffc149;
      --mine-wash: rgba(255, 193, 73, .13);
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -16px rgba(0, 0, 0, .8);
    }
  }

  :root[data-theme="dark"] {
    --brand: #6796f0;
    --brand-light: #93b6f5;
    --brand-wash: rgba(103, 150, 240, .12);
    --ink: #f2f6fc;
    --ink-soft: #c4d0e0;
    --ink-muted: #8b9cb1;
    --ground: #03101e;
    --panel: #0a1a2b;
    --panel-sunken: #071728;
    --line: rgba(255, 255, 255, .13);
    --line-soft: rgba(255, 255, 255, .08);
    --ok: #4ade80;
    --ok-wash: rgba(74, 222, 128, .13);
    --no: #f87f8d;
    --no-wash: rgba(248, 127, 141, .13);
    --mine: #ffc149;
    --mine-wash: rgba(255, 193, 73, .13);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -16px rgba(0, 0, 0, .8);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; letter-spacing: -.01em; }

  a { color: var(--brand); }

  button { font-family: inherit; cursor: pointer; }

  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }

  .eyebrow {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  code {
    font-family: var(--font-mono);
    font-size: .88em;
    background: var(--panel-sunken);
    border: 1px solid var(--line-soft);
    border-radius: 4px;
    padding: 1px 5px;
    color: var(--ink-soft);
  }

  /* ---------- masthead ---------- */

  .masthead {
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 22px 24px 20px;
  }

  .masthead-in {
    max-width: 1160px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 20px 32px;
  }

  .masthead h1 { font-size: 24px; }

  .masthead .lead {
    margin: 6px 0 0;
    color: var(--ink-muted);
    font-size: 13.5px;
    max-width: 64ch;
  }

  /* ---------- shell ---------- */

  .shell {
    max-width: 1160px;
    margin: 0 auto;
    padding: 28px 24px 150px;
    display: grid;
    grid-template-columns: 232px minmax(0, 1fr);
    gap: 36px;
    align-items: start;
  }

  .rail { position: sticky; top: 20px; display: flex; flex-direction: column; gap: 2px; }

  .rail-head { padding: 0 10px 8px; }

  .rail button {
    display: grid;
    grid-template-columns: 22px minmax(0, 1fr) auto;
    align-items: center;
    gap: 9px;
    width: 100%;
    text-align: left;
    background: none;
    border: 0;
    border-radius: 8px;
    padding: 7px 10px;
    color: var(--ink-soft);
    font-size: 13px;
    font-weight: 500;
    line-height: 1.3;
  }

  .rail button:hover { background: var(--panel); }

  .rail button[aria-current="true"] {
    background: var(--panel);
    color: var(--ink);
    font-weight: 600;
    box-shadow: var(--shadow);
  }

  .rail .rn { font-family: var(--font-mono); font-size: 11px; color: var(--ink-muted); }

  .rail button[aria-current="true"] .rn { color: var(--brand); }

  .rail .rc {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
  }

  .rail .rc[data-full="true"] { color: var(--ok); }
  .rail .rc[data-broken="true"] { color: var(--no); }

  /* ---------- group head ---------- */

  .group-head { padding-bottom: 18px; border-bottom: 1px solid var(--line); margin-bottom: 24px; }

  .group-head .row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px 16px; }

  .group-head h2 { font-size: 21px; }

  .group-head .bulk {
    margin-left: auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 5px 13px;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
  }

  .group-head .bulk:hover { border-color: var(--ok); color: var(--ok); }

  .group-note {
    margin: 14px 0 0;
    font-size: 13px;
    color: var(--ink-soft);
    background: var(--brand-wash);
    border-left: 2px solid var(--brand);
    border-radius: 0 8px 8px 0;
    padding: 10px 14px;
  }

  .cards { display: flex; flex-direction: column; gap: 16px; }

  /* ---------- intro blocks ---------- */

  .intro { display: flex; flex-direction: column; gap: 12px; }

  .intro-block {
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--brand);
    border-radius: 0 12px 12px 0;
    padding: 14px 18px;
    font-size: 14px;
    color: var(--ink-soft);
    box-shadow: var(--shadow);
  }

  .intro-block strong { color: var(--ink); }

  .intro-block[data-kind="warn"] { border-left-color: var(--mine); }

  /* ---------- card ---------- */

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--line);
    border-radius: 12px;
    padding: 18px 20px 16px;
    box-shadow: var(--shadow);
    scroll-margin-top: 24px;
  }

  .card[data-state="dziala"] { border-left-color: var(--ok); }
  .card[data-state="nie-dziala"] { border-left-color: var(--no); }
  .card[data-state="pominiete"] { border-left-color: var(--ink-muted); }

  .card-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 11px; }

  .chip {
    font-family: var(--font-mono);
    font-size: 11.5px;
    font-weight: 500;
    background: var(--panel-sunken);
    border: 1px solid var(--line-soft);
    border-radius: 5px;
    padding: 2px 7px;
    color: var(--brand);
  }

  .card-head h3 { font-size: 16.5px; flex: 1 1 260px; }

  .card-kind {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  .card-tag { margin: 6px 0 0; font-size: 13px; color: var(--ink-muted); }

  .card-note {
    margin: 13px 0 0;
    font-size: 13.5px;
    color: var(--ink-soft);
    background: var(--panel-sunken);
    border-radius: 8px;
    padding: 9px 13px;
  }

  .flag {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--mine);
    background: var(--mine-wash);
    border-radius: 999px;
    padding: 2px 9px;
  }

  .flag[hidden] { display: none !important; }

  /* ---------- prompt ---------- */

  .promptbox {
    margin-top: 14px;
    background: var(--panel-sunken);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }

  .promptbox-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 9px 7px 13px;
    border-bottom: 1px solid var(--line-soft);
  }

  .promptbox-head span {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  .promptbox-head button {
    margin-left: auto;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink-soft);
  }

  .promptbox-head button:hover { border-color: var(--brand); color: var(--brand); }

  .promptbox-head button.ok { border-color: var(--ok); color: var(--ok); }

  .promptbox pre {
    margin: 0;
    padding: 12px 14px;
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.55;
    color: var(--ink-soft);
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 260px;
    overflow: auto;
  }

  /* ---------- manual steps ---------- */

  .steps { margin: 14px 0 0; }

  .steps-name {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin-bottom: 7px;
  }

  .steps ol { margin: 0; padding-left: 0; list-style: none; counter-reset: s; }

  .steps li {
    counter-increment: s;
    display: grid;
    grid-template-columns: 20px minmax(0, 1fr);
    gap: 10px;
    font-size: 14.5px;
    padding: 3px 0;
  }

  .steps li::before {
    content: counter(s);
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--brand);
    background: var(--brand-wash);
    border-radius: 5px;
    height: 18px;
    display: grid;
    place-items: center;
    margin-top: 3px;
  }

  /* ---------- pass / fail ---------- */

  .pf { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }

  .pf > div {
    min-width: 0;
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 14px;
    line-height: 1.5;
  }

  .pf-ok { background: var(--ok-wash); }
  .pf-no { background: var(--no-wash); }

  .pf-lbl {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .07em;
    text-transform: uppercase;
    margin-bottom: 5px;
  }

  .pf-lbl i { width: 8px; height: 8px; border-radius: 50%; flex: none; }

  .pf-ok .pf-lbl { color: var(--ok); }
  .pf-ok .pf-lbl i { background: var(--ok); }
  .pf-no .pf-lbl { color: var(--no); }
  .pf-no .pf-lbl i { background: var(--no); }

  .pf p { margin: 0; color: var(--ink); }

  .trap {
    margin: 13px 0 0;
    font-size: 13.5px;
    color: var(--ink-soft);
    background: var(--mine-wash);
    border-left: 2px solid var(--mine);
    border-radius: 0 8px 8px 0;
    padding: 9px 13px;
  }

  .trap b { color: var(--mine); }

  /* ---------- verdict ---------- */

  .verdict {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--line-soft);
  }

  .verdict button {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 15px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
  }

  .verdict button:hover { border-color: var(--brand); color: var(--brand); }

  .verdict button[aria-pressed="true"] { color: #fff; }

  .verdict button[data-v="dziala"][aria-pressed="true"] { background: var(--ok); border-color: var(--ok); }
  .verdict button[data-v="nie-dziala"][aria-pressed="true"] { background: var(--no); border-color: var(--no); }
  .verdict button[data-v="pominiete"][aria-pressed="true"] { background: var(--ink-muted); border-color: var(--ink-muted); }

  .verdict .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }

  .verdict .note-toggle { color: var(--mine); border-color: color-mix(in srgb, var(--mine) 45%, var(--line)); }

  .verdict .note-toggle:hover { border-color: var(--mine); color: var(--mine); }

  .verdict .note-toggle[aria-pressed="true"] {
    background: var(--mine);
    border-color: var(--mine);
    color: #1a1200;
  }

  .verdict .hint { font-size: 12px; color: var(--ink-muted); margin-left: auto; }

  .note-box { margin-top: 12px; }

  .note-box[hidden] { display: none !important; }

  .note-box label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--mine);
    margin-bottom: 6px;
  }

  textarea {
    width: 100%;
    min-height: 66px;
    resize: vertical;
    font-family: var(--font-ui);
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink);
    background: var(--panel-sunken);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 10px 12px;
  }

  textarea::placeholder { color: var(--ink-muted); }

  /* ---------- footer bar ---------- */

  .bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--panel);
    border-top: 1px solid var(--line);
    padding: 12px 24px;
    z-index: 20;
  }

  .bar-in {
    max-width: 1160px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px 20px;
  }

  .meter { flex: 1 1 200px; min-width: 170px; }

  .meter-track {
    height: 6px;
    background: var(--panel-sunken);
    border: 1px solid var(--line-soft);
    border-radius: 999px;
    overflow: hidden;
  }

  .meter-fill { height: 100%; width: 0; background: var(--brand); transition: width .18s ease; }

  .meter-text { font-size: 12px; color: var(--ink-muted); margin-top: 5px; }

  .tally { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; font-variant-numeric: tabular-nums; }

  .tally span { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-soft); }

  .tally i { width: 9px; height: 9px; border-radius: 50%; }

  .bar-actions { display: flex; gap: 8px; margin-left: auto; }

  .btn {
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink-soft);
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
  }

  .btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; }

  .btn:hover { border-color: var(--brand); }

  .btn-primary:hover { background: var(--brand-light); border-color: var(--brand-light); }

  /* ---------- export ---------- */

  .export { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 24px; }

  .export[hidden] { display: none !important; }

  .export-scrim { position: absolute; inset: 0; background: rgba(3, 16, 30, .55); border: 0; }

  .export-panel {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px;
    width: min(780px, 100%);
    max-height: 84vh;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: 0 24px 70px -20px rgba(3, 16, 30, .6);
  }

  .export-panel h3 { font-size: 18px; }

  .export-panel p { margin: 0; font-size: 13px; color: var(--ink-muted); }

  .export-panel textarea { flex: 1; min-height: 320px; font-family: var(--font-mono); font-size: 12.5px; }

  .export-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  .export-row .said { font-size: 12.5px; color: var(--ok); font-weight: 600; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  @media (max-width: 900px) {
    .shell { grid-template-columns: minmax(0, 1fr); gap: 20px; padding-bottom: 180px; }
    .rail { position: static; flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
    .rail-head { display: none; }
    .rail button { width: auto; white-space: nowrap; grid-template-columns: auto auto auto; background: var(--panel); border: 1px solid var(--line); }
    .pf { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-in">
    <div>
      <p class="eyebrow" id="mEyebrow"></p>
      <h1 id="mTitle"></h1>
      <p class="lead" id="mLead"></p>
    </div>
  </div>
</header>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Grupy scenariuszy">
    <p class="eyebrow rail-head">Kroki</p>
  </nav>
  <main id="main"></main>
</div>

<div class="bar">
  <div class="bar-in">
    <div class="meter">
      <div class="meter-track"><div class="meter-fill" id="fill"></div></div>
      <p class="meter-text" id="meterText">0 z 0 sprawdzonych</p>
    </div>
    <div class="tally">
      <span><i style="background: var(--ok)"></i><b id="cOk">0</b> działa</span>
      <span><i style="background: var(--no)"></i><b id="cNo">0</b> nie działa</span>
      <span><i style="background: var(--ink-muted)"></i><b id="cSkip">0</b> pominięte</span>
      <span><i style="background: var(--mine)"></i><b id="cNote">0</b> z uwagą</span>
    </div>
    <div class="bar-actions">
      <button class="btn" id="jumpBtn" type="button">Pierwszy niewypełniony</button>
      <button class="btn" id="resetBtn" type="button">Wyczyść</button>
      <button class="btn btn-primary" id="exportBtn" type="button">Zbierz wynik</button>
    </div>
  </div>
</div>

<div class="export" id="export" hidden>
  <button class="export-scrim" id="scrim" type="button" aria-label="Zamknij"></button>
  <div class="export-panel" role="dialog" aria-modal="true" aria-labelledby="exportTitle">
    <h3 id="exportTitle">Wynik bramki</h3>
    <p>Zapisz plik i wrzuć mi go, albo skopiuj i wklej w terminalu. Jedno i drugie niesie to samo.</p>
    <textarea id="exportText" readonly></textarea>
    <div class="export-row">
      <button class="btn btn-primary" id="saveBtn" type="button">Zapisz plik .md</button>
      <button class="btn" id="copyBtn" type="button">Kopiuj</button>
      <button class="btn" id="closeBtn" type="button">Zamknij</button>
      <span class="said" id="said" hidden></span>
    </div>
  </div>
</div>

<script>
/* ============================================================================
   TU WYPEŁNIASZ — wszystko poniżej sekcji SILNIK jest gotowe i się nie rusza.
   ============================================================================ */

var GATE = {
  // ZMIEŃ — unikalny per bramka. Dwie bramki z tym samym kluczem nadpisują sobie stan.
  key: 'bramka-SLUG-2026-01-01',

  // ZMIEŃ — nazwa pliku .md, który wypada po kliknięciu „Zapisz plik".
  plik: 'bramka-SLUG-wynik.md',

  eyebrow: 'NAZWA PROJEKTU · STYCZEŃ 2026',
  tytul: 'Bramka manualna — TYTUŁ',
  lead: 'Jedno-dwa zdania: co ta bramka rozstrzyga i dlaczego jest teraz. Idziesz krok po kroku, na końcu klikasz „Zbierz wynik" i wrzucasz mi plik.',

  // ZMIEŃ — kontekst wpisywany w nagłówek wyniku. Markdown, jedna linia = jeden punkt.
  meta: [
    '- branch: `feat/NAZWA`',
    '- pliki testowe: `~/Desktop/KATALOG`'
  ],

  // Bloki na ekranie „Zanim zaczniesz". Trzeci (kind: 'warn') wypełniaj ZAWSZE,
  // gdy środowisko bramki ma znane ograniczenie — ratuje przed fałszywym FAIL-em.
  intro: [
    {
      kind: 'info',
      text: '**Jak to działa.** Idziesz krok po kroku. Gdzie jest prompt, klikasz „Kopiuj" i wklejasz go agentowi. Patrzysz na wynik i zaznaczasz jedno z trzech. Zaznaczenia zapisują się same — możesz zamknąć kartę i wrócić.'
    },
    {
      kind: 'info',
      text: '**Uwaga nie jest werdyktem.** Jeśli coś zadziałało, ale Cię ubodło — zostaw *Działa* i kliknij „Mam uwagę". Rozdzielam te dwie rzeczy świadomie, żeby Twoje wątpliwości nie zabrudziły listy tego, co realnie pęka. Uwaga do działającego scenariusza jest dla mnie tak samo cenna jak awaria.'
    },
    {
      kind: 'warn',
      text: '**Czego nie liczyć jako błąd.** Tu wpisz znane ograniczenie środowiska: czego dev build nie potrafi, który MCP nie wystartuje, co jest już przygotowane i gdzie leżą pliki testowe. Bez tego bloku dostaniesz fałszywy FAIL za coś, co nie jest defektem tej zmiany.'
    }
  ],

  // Karta końcowa. Jedno konkretne pytanie produktowe, nie „jak Ci się podobało".
  koniec: {
    pytanie: 'Pytanie, na które najbardziej czekam — jedno, konkretne, produktowe.',
    placeholder: 'Cokolwiek: co przeszkadzało, co było niejasne, czego się nie spodziewałeś, co jeszcze przestało działać…'
  }
};

/* Grupa = jeden ekran w lewej szynie. Karta = jeden scenariusz z jednym werdyktem.
   Pola karty:
     id      wymagane, krótkie, unikalne w całej bramce (S1, S2…). Trafia do wyniku.
     title   wymagane, w języku użytkownika, nie w żargonie.
     tag     opcjonalne, jedna linia kontekstu pod tytułem.
     note    opcjonalne, co jest już przygotowane / skąd startujesz.
     prompt  opcjonalne, string albo tablica stringów. Każdy dostaje własny „Kopiuj".
             Pełne ścieżki — użytkownik nie ma nic dopisywać ani sklejać z dwóch miejsc.
     steps   opcjonalne, tablica kroków do wyklikania ręcznie w aplikacji.
     ok      wymagane, obserwowalny skutek. Musi ROZRÓŻNIAĆ: na złym kodzie ma być czerwony.
     fail    wymagane, konkretny objaw awarii, nie „coś poszło źle".
     trap    opcjonalne, co wygląda na błąd, a błędem nie jest.
   W tekstach działa `kod` i **pogrubienie**. */

var GROUPS = [
  {
    n: 'A',
    name: 'Nazwa grupy',
    note: 'Jedno zdanie: co ta grupa rozstrzyga.',
    items: [
      {
        id: 'S1',
        title: 'Tytuł scenariusza w języku użytkownika, nie w żargonie',
        tag: 'jedna linia kontekstu, jeśli tytuł nie wystarcza',
        note: 'Co jest już przygotowane, skąd startujesz. Usuń, jeśli zbędne.',
        prompt: 'Gotowy prompt do wklejenia agentowi, z pełnymi ścieżkami.',
        steps: [
          'Krok do wyklikania ręcznie, jeśli scenariusz nie jest promptem.',
          'Drugi krok. Usuń całe `steps`, jeśli wystarcza sam prompt.'
        ],
        ok: 'Obserwowalny skutek. Nie stan wewnętrzny, nie „nie ma błędu".',
        fail: 'Konkretny objaw awarii: co dokładnie zobaczysz, gdy jest źle.',
        trap: 'Pułapka: co wygląda na błąd, a błędem nie jest. Usuń, jeśli scenariusz jej nie ma.'
      },
      {
        id: 'S2',
        title: 'Drugi scenariusz',
        ok: 'Widzisz X.',
        fail: 'Widzisz Y albo nie widzisz nic.'
      }
    ]
  },
  {
    n: 'B',
    name: 'Druga grupa',
    items: [
      {
        id: 'S3',
        title: 'Trzeci scenariusz',
        ok: '…',
        fail: '…'
      }
    ]
  }
];

/* ============================================================================
   SILNIK — nie ruszasz.
   ============================================================================ */

(function () {
  var VERDICTS = [
    { v: 'dziala', label: 'Działa' },
    { v: 'nie-dziala', label: 'Nie działa' },
    { v: 'pominiete', label: 'Pominięte' }
  ];
  // Etykiety w markdownie. Awaria krzyczy wielkimi literami, żeby nie dało się jej przeoczyć.
  var WYNIK_LABEL = { 'dziala': 'działa', 'nie-dziala': 'NIE DZIAŁA', 'pominiete': 'pominięte', '': 'bez werdyktu' };
  var INTRO_ID = '__intro';
  var KONIEC_ID = 'OGOLNE';

  var state = load();
  var steps = buildSteps();
  var current = steps[0].sid;

  function load() {
    try {
      var raw = localStorage.getItem(GATE.key);
      if (raw) {
        var s = JSON.parse(raw);
        return { v: s.v || {}, notes: s.notes || {}, open: s.open || {} };
      }
    } catch (e) {}
    return { v: {}, notes: {}, open: {} };
  }

  function save() {
    try { localStorage.setItem(GATE.key, JSON.stringify(state)); } catch (e) {}
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // Lekki markdown w tekstach danych: `kod`, **pogrubienie**, *kursywa*.
  function md(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>');
  }

  function buildSteps() {
    var out = [{ sid: INTRO_ID, n: '—', name: 'Zanim zaczniesz', intro: true, items: [] }];
    GROUPS.forEach(function (g, i) {
      out.push({ sid: 'g' + i, n: g.n || String(i + 1), name: g.name, note: g.note, items: g.items || [] });
    });
    out.push({ sid: KONIEC_ID, n: '—', name: 'Na koniec', koniec: true, items: [] });
    return out;
  }

  function allItems() {
    var out = [];
    steps.forEach(function (s) { s.items.forEach(function (it) { out.push(it); }); });
    return out;
  }

  function hasNote(id) {
    return !!(state.notes[id] && state.notes[id].trim());
  }

  function noteOpen(id) {
    return hasNote(id) || !!state.open[id];
  }

  /* ---------- rail ---------- */

  function renderRail() {
    var rail = document.getElementById('rail');
    Array.prototype.forEach.call(rail.querySelectorAll('button'), function (b) { b.remove(); });
    steps.forEach(function (s) {
      var b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('aria-current', s.sid === current ? 'true' : 'false');
      var count = '';
      if (s.items.length) {
        var done = s.items.filter(function (it) { return !!state.v[it.id]; }).length;
        var broken = s.items.filter(function (it) { return state.v[it.id] === 'nie-dziala'; }).length;
        count = '<span class="rc" data-full="' + (done === s.items.length) + '" data-broken="' + (broken > 0) + '">'
          + done + '/' + s.items.length + '</span>';
      } else {
        count = '<span class="rc"></span>';
      }
      b.innerHTML = '<span class="rn">' + esc(s.n) + '</span><span>' + esc(s.name) + '</span>' + count;
      b.addEventListener('click', function () {
        current = s.sid;
        renderRail();
        renderStep();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
      rail.appendChild(b);
    });
  }

  /* ---------- card ---------- */

  function promptBlock(text, i, total) {
    var label = total > 1 ? 'Wklej to agentowi · ' + (i + 1) + ' z ' + total : 'Wklej to agentowi';
    return '<div class="promptbox">'
      + '<div class="promptbox-head"><span>' + esc(label) + '</span>'
      + '<button type="button" data-copy>Kopiuj</button></div>'
      + '<pre data-prompt>' + esc(text) + '</pre></div>';
  }

  function renderCard(item) {
    var v = state.v[item.id] || '';
    var open = noteOpen(item.id);

    var html = '<article class="card" data-id="' + esc(item.id) + '" data-state="' + esc(v) + '">';

    html += '<div class="card-head">'
      + '<span class="chip">' + esc(item.id) + '</span>'
      + '<h3>' + esc(item.title) + '</h3>'
      + '<span class="flag"' + (hasNote(item.id) ? '' : ' hidden') + ' data-flag>uwaga</span>'
      + '<span class="card-kind">scenariusz</span>'
      + '</div>';

    if (item.tag) html += '<p class="card-tag">' + md(item.tag) + '</p>';
    if (item.note) html += '<p class="card-note">' + md(item.note) + '</p>';

    if (item.prompt) {
      var ps = Object.prototype.toString.call(item.prompt) === '[object Array]' ? item.prompt : [item.prompt];
      ps.forEach(function (p, i) { html += promptBlock(p, i, ps.length); });
    }

    if (item.steps && item.steps.length) {
      html += '<div class="steps"><div class="steps-name">Co zrobić</div><ol>'
        + item.steps.map(function (s) { return '<li><span>' + md(s) + '</span></li>'; }).join('')
        + '</ol></div>';
    }

    html += '<div class="pf">'
      + '<div class="pf-ok"><div class="pf-lbl"><i></i>Działa, jeśli</div><p>' + md(item.ok) + '</p></div>'
      + '<div class="pf-no"><div class="pf-lbl"><i></i>Nie działa, jeśli</div><p>' + md(item.fail) + '</p></div>'
      + '</div>';

    if (item.trap) html += '<p class="trap"><b>Pułapka.</b> ' + md(item.trap) + '</p>';

    html += '<div class="verdict">'
      + VERDICTS.map(function (d) {
          return '<button type="button" data-v="' + d.v + '" aria-pressed="' + (v === d.v) + '">'
            + d.label + '</button>';
        }).join('')
      + '<span class="sep"></span>'
      + '<button type="button" class="note-toggle" data-note-toggle aria-pressed="' + open + '">'
      + 'Mam uwagę</button>'
      + '<span class="hint">Uwagę możesz dopisać do każdego werdyktu</span>'
      + '</div>';

    html += '<div class="note-box"' + (open ? '' : ' hidden') + '>'
      + '<label for="n-' + esc(item.id) + '">Co dokładnie zobaczyłeś</label>'
      + '<textarea id="n-' + esc(item.id) + '" placeholder="Objaw, brzmienie komunikatu, co Cię ubodło — również gdy scenariusz działa">'
      + esc(state.notes[item.id] || '') + '</textarea></div>';

    html += '</article>';
    return html;
  }

  /* ---------- step ---------- */

  function renderStep() {
    var step = steps.filter(function (s) { return s.sid === current; })[0];
    var main = document.getElementById('main');
    var html = '';

    if (step.intro) {
      html += '<div class="group-head"><div class="row">'
        + '<p class="eyebrow">Start</p><h2>' + esc(step.name) + '</h2></div></div>';
      html += '<div class="intro">' + (GATE.intro || []).map(function (b) {
        return '<div class="intro-block" data-kind="' + esc(b.kind || 'info') + '">' + md(b.text) + '</div>';
      }).join('') + '</div>';
      main.innerHTML = html;
      wireStep(step);
      return;
    }

    if (step.koniec) {
      html += '<div class="group-head"><div class="row">'
        + '<p class="eyebrow">Koniec</p><h2>' + esc(step.name) + '</h2></div></div>';
      html += '<article class="card" data-id="' + KONIEC_ID + '">'
        + '<div class="card-head"><span class="chip">—</span><h3>Twoje ogólne zdanie</h3>'
        + '<span class="card-kind">poza licznikiem</span></div>'
        + '<p class="card-note">' + md(GATE.koniec.pytanie) + '</p>'
        + '<div class="note-box"><label for="n-' + KONIEC_ID + '">Odpowiedz swoimi słowami</label>'
        + '<textarea id="n-' + KONIEC_ID + '" placeholder="' + esc(GATE.koniec.placeholder) + '">'
        + esc(state.notes[KONIEC_ID] || '') + '</textarea></div>'
        + '</article>';
      main.innerHTML = html;
      wireStep(step);
      return;
    }

    html += '<div class="group-head"><div class="row">'
      + '<p class="eyebrow">Krok ' + esc(step.n) + '</p>'
      + '<h2>' + esc(step.name) + '</h2>'
      + '<button class="bulk" type="button" id="bulk" title="Ustawia „Działa" tylko tam, gdzie nie ma jeszcze werdyktu">Reszta tutaj działa</button>'
      + '</div>'
      + (step.note ? '<p class="group-note">' + md(step.note) + '</p>' : '')
      + '</div>';

    html += '<div class="cards">' + step.items.map(renderCard).join('') + '</div>';
    main.innerHTML = html;
    wireStep(step);
  }

  function wireStep(step) {
    var bulk = document.getElementById('bulk');
    if (bulk) {
      bulk.addEventListener('click', function () {
        step.items.forEach(function (it) { if (!state.v[it.id]) state.v[it.id] = 'dziala'; });
        save();
        renderStep();
        renderRail();
      });
    }

    Array.prototype.forEach.call(document.querySelectorAll('[data-copy]'), function (btn) {
      btn.addEventListener('click', function () {
        var pre = btn.parentNode.parentNode.querySelector('[data-prompt]');
        copyText(pre.textContent, function (ok) {
          btn.textContent = ok ? 'Skopiowane' : 'Nie wyszło';
          btn.classList.toggle('ok', ok);
          setTimeout(function () { btn.textContent = 'Kopiuj'; btn.classList.remove('ok'); }, 1400);
        });
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll('.card'), function (card) {
      var id = card.dataset.id;

      Array.prototype.forEach.call(card.querySelectorAll('.verdict [data-v]'), function (btn) {
        btn.addEventListener('click', function () { setVerdict(id, btn.dataset.v); });
      });

      var toggle = card.querySelector('[data-note-toggle]');
      if (toggle) toggle.addEventListener('click', function () { toggleNote(id); });

      var ta = card.querySelector('textarea');
      if (ta) {
        ta.addEventListener('input', function () {
          state.notes[id] = ta.value;
          if (ta.value.trim()) state.open[id] = true;
          save();
          var flag = card.querySelector('[data-flag]');
          if (flag) flag.hidden = !ta.value.trim();
          renderTally();
        });
      }
    });

    renderTally();
  }

  function setVerdict(id, v) {
    if (state.v[id] === v) delete state.v[id];
    else state.v[id] = v;
    save();

    var card = document.querySelector('.card[data-id="' + id + '"]');
    if (card) {
      card.dataset.state = state.v[id] || '';
      Array.prototype.forEach.call(card.querySelectorAll('.verdict [data-v]'), function (b) {
        b.setAttribute('aria-pressed', String(state.v[id] === b.dataset.v));
      });
    }
    renderRail();
    renderTally();
  }

  // Zwinięcie jest możliwe tylko wtedy, gdy pole jest puste — inaczej ukrywałoby dane.
  function toggleNote(id) {
    var card = document.querySelector('.card[data-id="' + id + '"]');
    if (!card) return;
    var box = card.querySelector('.note-box');
    var ta = box.querySelector('textarea');
    var toggle = card.querySelector('[data-note-toggle]');

    if (box.hidden) {
      state.open[id] = true;
      box.hidden = false;
      toggle.setAttribute('aria-pressed', 'true');
      ta.focus();
    } else if (!ta.value.trim()) {
      delete state.open[id];
      box.hidden = true;
      toggle.setAttribute('aria-pressed', 'false');
    } else {
      ta.focus();
    }
    save();
  }

  /* ---------- tally ---------- */

  function renderTally() {
    var items = allItems();
    var total = items.length;
    var done = items.filter(function (it) { return !!state.v[it.id]; }).length;
    var ok = items.filter(function (it) { return state.v[it.id] === 'dziala'; }).length;
    var no = items.filter(function (it) { return state.v[it.id] === 'nie-dziala'; }).length;
    var sk = items.filter(function (it) { return state.v[it.id] === 'pominiete'; }).length;
    var nt = items.filter(function (it) { return hasNote(it.id); }).length;

    document.getElementById('fill').style.width = (total ? (done / total) * 100 : 0) + '%';
    document.getElementById('meterText').textContent = done + ' z ' + total + ' sprawdzonych'
      + (done < total ? ' · ' + (total - done) + ' bez werdyktu' : '');
    document.getElementById('cOk').textContent = ok;
    document.getElementById('cNo').textContent = no;
    document.getElementById('cSkip').textContent = sk;
    document.getElementById('cNote').textContent = nt;
  }

  /* ---------- wynik ---------- */

  function build() {
    var items = allItems();
    var ok = 0, no = 0, sk = 0, br = 0, okNote = 0;
    items.forEach(function (it) {
      var v = state.v[it.id];
      if (v === 'dziala') { ok++; if (hasNote(it.id)) okNote++; }
      else if (v === 'nie-dziala') no++;
      else if (v === 'pominiete') sk++;
      else br++;
    });

    var L = ['# Wynik bramki: ' + GATE.tytul, ''];
    var _d = new Date();
    var _p = function (n) { return String(n).padStart(2, '0'); };
    L.push('- data: ' + _d.getFullYear() + '-' + _p(_d.getMonth() + 1) + '-' + _p(_d.getDate()) +
           ' ' + _p(_d.getHours()) + ':' + _p(_d.getMinutes()));
    (GATE.meta || []).forEach(function (m) { L.push(m); });
    L.push('');

    L.push('## Podsumowanie', '');
    L.push('- działa: ' + ok + (okNote ? ' (w tym ' + okNote + ' z uwagą)' : ''));
    L.push('- NIE DZIAŁA: ' + no);
    L.push('- pominięte: ' + sk);
    L.push('- bez werdyktu: ' + br);
    L.push('');

    steps.forEach(function (s) {
      if (!s.items.length) return;
      L.push('## Krok ' + s.n + ' — ' + s.name, '');
      s.items.forEach(function (it) {
        L.push('### ' + it.id + ' — ' + it.title);
        L.push('- werdykt: **' + WYNIK_LABEL[state.v[it.id] || ''] + '**');
        if (hasNote(it.id)) L.push('- uwaga: ' + state.notes[it.id].replace(/\s*\n\s*/g, ' ').trim());
        L.push('');
      });
    });

    if (hasNote(KONIEC_ID)) {
      L.push('## Ogólne zdanie', '', state.notes[KONIEC_ID].trim(), '');
    }

    return L.join('\n');
  }

  /* ---------- kopiowanie ---------- */

  // Fallback przez execCommand, bo clipboard API w stronie z file:// bywa zablokowane.
  function copyText(txt, cb) {
    var legacy = function () {
      var ta = document.createElement('textarea');
      ta.value = txt;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      cb(ok);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function () { cb(true); }, legacy);
    } else {
      legacy();
    }
  }

  /* ---------- pasek i modal ---------- */

  function said(msg) {
    var el = document.getElementById('said');
    el.textContent = msg;
    el.hidden = false;
  }

  document.getElementById('jumpBtn').addEventListener('click', function () {
    for (var i = 0; i < steps.length; i++) {
      var pending = steps[i].items.filter(function (it) { return !state.v[it.id]; });
      if (pending.length) {
        if (current !== steps[i].sid) { current = steps[i].sid; renderRail(); renderStep(); }
        var card = document.querySelector('.card[data-id="' + pending[0].id + '"]');
        if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
        return;
      }
    }
    current = KONIEC_ID;
    renderRail();
    renderStep();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  document.getElementById('exportBtn').addEventListener('click', function () {
    var ta = document.getElementById('exportText');
    ta.value = build();
    document.getElementById('said').hidden = true;
    document.getElementById('export').hidden = false;
    ta.focus();
    ta.setSelectionRange(0, 0);
  });

  function closeExport() {
    document.getElementById('export').hidden = true;
    document.getElementById('exportBtn').focus();
  }

  document.getElementById('closeBtn').addEventListener('click', closeExport);
  document.getElementById('scrim').addEventListener('click', closeExport);

  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && !document.getElementById('export').hidden) closeExport();
  });

  document.getElementById('saveBtn').addEventListener('click', function () {
    var blob = new Blob([document.getElementById('exportText').value], { type: 'text/markdown;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = GATE.plik;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    said('zapisane — sprawdź Pulpit albo Pobrane');
  });

  document.getElementById('copyBtn').addEventListener('click', function () {
    var ta = document.getElementById('exportText');
    copyText(ta.value, function (ok) {
      if (ok) said('w schowku — wklej mi to');
      else { ta.select(); said('zaznaczone, wciśnij Cmd+C'); }
    });
  });

  document.getElementById('resetBtn').addEventListener('click', function () {
    if (!window.confirm('Wyczyścić wszystkie werdykty i uwagi?')) return;
    state = { v: {}, notes: {}, open: {} };
    save();
    renderRail();
    renderStep();
  });
